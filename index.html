<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">

  <!-- Référencement : carte publique du Galion, indexable depuis le 21/11/2026 -->
  <meta name="description" content="La carte du Galion à Sanary-sur-Mer : crêpes au sarrasin et au froment, moules, incontournables, glaces artisanales, petits-déjeuners et boissons. Brasserie, crêperie et glacier.">
  <link rel="canonical" href="https://legalion-sanary.fr/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:site_name" content="Le Galion">
  <meta property="og:title" content="Le Galion · Carte · Sanary-sur-Mer">
  <meta property="og:description" content="Crêpes, moules, incontournables, glaces artisanales et boissons : toute la carte du Galion, brasserie, crêperie et glacier à Sanary-sur-Mer.">
  <meta property="og:url" content="https://legalion-sanary.fr/">
  <meta property="og:image" content="https://legalion-sanary.fr/images/og-legalion.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Restaurant",
    "name": "Le Galion",
    "description": "Brasserie, crêperie et glacier à Sanary-sur-Mer.",
    "url": "https://legalion-sanary.fr/",
    "image": "https://legalion-sanary.fr/images/og-legalion.jpg",
    "servesCuisine": ["Crêperie", "Brasserie", "Glacier"],
    "hasMenu": "https://legalion-sanary.fr/",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "1 place de la Liberté",
      "postalCode": "83110",
      "addressLocality": "Sanary-sur-Mer",
      "addressCountry": "FR"
    },
    "sameAs": ["https://www.facebook.com/pages/category/Cr%C3%AAperie/Le-Galion-Cr%C3%AAperie-Brasserie-Glacier-715208795196513"]
  }
  </script>

  <!-- Site autonome sur legalion-sanary.fr : les chemins relatifs partent de la racine.
       (Avant le 21/11/2026, la carte vivait sous paper34.fr/FLASHCODE/LEGALION, d où ce base href.)
       Sans <base>, les chemins relatifs résoudraient au mauvais endroit. -->
  <base href="/">

  <title>Le Galion · Carte · Brasserie, crêperie et glacier à Sanary-sur-Mer</title>

  <!-- Préchargement des polices custom pour éviter le FOIT -->
  <link rel="preload" href="fonts/foco-webfont.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="fonts/rift_soft_bold-webfont.woff" as="font" type="font/woff" crossorigin>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="hero">
    <!-- Lien Facebook : URL injectée par menu.js depuis menu.json -->
    <a id="facebook-link" class="hero__facebook" href="#" target="_blank" rel="noopener" aria-label="Facebook Le Galion" hidden>
      <img src="images/facebook-legalion.svg" alt="">
    </a>

    <div class="hero__visual">
      <img class="hero__boat" src="images/bateau-galion.png" alt="" aria-hidden="true">
      <img class="hero__logo" src="images/logo-legalion.svg" alt="Le Galion · Brasserie · Crêperie · Glacier">
    </div>

    <!-- Sélecteur de langue maison, pilote Google Translate en coulisse -->
    <div class="hero__lang">
      <div class="lang-switcher" role="group" aria-label="Langue">
        <button type="button" class="lang-switcher__btn is-active" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" class="lang-switcher__btn" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" class="lang-switcher__btn" data-lang="es" aria-pressed="false">ES</button>
        <button type="button" class="lang-switcher__btn" data-lang="de" aria-pressed="false">DE</button>
        <button type="button" class="lang-switcher__btn" data-lang="it" aria-pressed="false">IT</button>
        <button type="button" class="lang-switcher__btn" data-lang="nl" aria-pressed="false">NL</button>
      </div>
      <!-- Widget Google Translate caché, on intercepte son <select> via JS -->
      <div id="google_translate_element" aria-hidden="true"></div>
    </div>
  </header>

  <!-- Navigation par section : chips horizontaux, sticky au scroll -->
  <nav id="section-nav" class="section-nav" aria-label="Sections de la carte" hidden></nav>

  <!-- Contenu de la carte injecté par menu.js depuis menu.json -->
  <main id="menu" aria-live="polite">
    <p class="loading">Chargement de la carte…</p>
  </main>

  <!-- Bouton boissons + footer (injectés par menu.js également) -->
  <div id="tail"></div>

  <script src="menu.js" defer></script>
  <!-- Vercel Web Analytics : mesure d’audience sans cookie -->
  <script defer src="/_vercel/insights/script.js"></script>

  <!-- Google Translate (chargé à la demande, UI cachée, on pilote le <select> nous-même) -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'fr',
        includedLanguages: 'en,es,de,it,nl,fr',
        // VERTICAL produit un <select> que nos chips pilotent.
        // SIMPLE/HORIZONTAL ne créent pas de <select> exploitable.
        layout: google.translate.TranslateElement.InlineLayout.VERTICAL,
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <!-- Le script Google n'est plus chargé à l'ouverture : uniquement au premier clic sur une langue
       (ou si le visiteur avait déjà choisi une langue, cookie googtrans présent). -->

  <!-- Sélecteur de langue : déclenche le <select> Google caché -->
  <script>
    (function () {
      const buttons = document.querySelectorAll('.lang-switcher__btn');

      // Restaure la langue active depuis le cookie googtrans (ex: "/fr/en")
      const cookieMatch = document.cookie.match(/googtrans=\/(?:auto|fr)\/([a-zA-Z-]+)/);
      const initialLang = cookieMatch ? cookieMatch[1] : 'fr';
      buttons.forEach((b) => {
        const on = b.dataset.lang === initialLang;
        b.classList.toggle('is-active', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });

      // Charge le script Google Traduction une seule fois, à la demande
      let gtLoaded = false;
      function loadGoogleTranslate() {
        if (gtLoaded) return;
        gtLoaded = true;
        const sc = document.createElement('script');
        sc.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
        sc.async = true;
        document.body.appendChild(sc);
      }
      // Langue déjà choisie lors d'une visite précédente : on recharge la traduction
      if (initialLang !== 'fr') loadGoogleTranslate();

      function applyLang(lang) {
        // Cherche le <select> injecté par Google Translate (peut être en cours de chargement)
        const select = document.querySelector('select.goog-te-combo');
        if (!select) {
          // Réessaye dès que possible
          return setTimeout(() => applyLang(lang), 200);
        }
        // En français (langue d'origine), Google attend une valeur vide
        select.value = lang === 'fr' ? '' : lang;
        select.dispatchEvent(new Event('change'));
      }

      buttons.forEach((btn) => {
        btn.addEventListener('click', () => {
          const lang = btn.dataset.lang;
          buttons.forEach((b) => {
            const on = b === btn;
            b.classList.toggle('is-active', on);
            b.setAttribute('aria-pressed', on ? 'true' : 'false');
          });
          // Retour au français sans avoir jamais traduit : rien à charger
          if (lang === 'fr' && !gtLoaded) return;
          loadGoogleTranslate();
          applyLang(lang);
        });
      });
    })();
  </script>

</body>
</html>
